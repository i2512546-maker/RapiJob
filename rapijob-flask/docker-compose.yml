services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-rapijob}
      MYSQL_USER: ${DB_USER:-rapijob}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rapijob}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./db/schema_mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed_mysql.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-rapijob}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-rapijob}
      DB_PASSWORD: ${DB_PASSWORD:-rapijob}
      DB_NAME: ${DB_NAME:-rapijob}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysqldata:
