{% extends "base.html" %}
{% block title %}Iniciar Sesión - RapiJob{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold gradient-bg bg-clip-text text-transparent">RapiJob</h1>
            <p class="text-gray-500 mt-2">Conectamos técnicos con clientes</p>
        </div>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
            </div>
            <button type="submit"
                class="w-full py-2 px-4 gradient-bg text-white rounded-lg font-medium hover:opacity-90 transition">
                Iniciar Sesión
            </button>
        </form>
        <p class="text-center mt-6 text-sm text-gray-500">
            ¿No tienes cuenta? <a href="/register" class="text-purple-600 hover:underline">Regístrate</a>
        </p>
    </div>
</div>
{% endblock %}
