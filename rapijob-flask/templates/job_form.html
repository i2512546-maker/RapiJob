{% extends "base.html" %}
{% block title %}Publicar Servicio - RapiJob{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-2">Publicar un servicio</h1>
    <p class="text-gray-500 mb-6">Describe el servicio que ofreces para que los clientes te encuentren.</p>

    <form method="POST" class="bg-white rounded-xl shadow p-8 space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Título del servicio *</label>
            <input type="text" name="titulo" required placeholder="Ej: Instalación y reparación eléctrica"
                value="{{ form.get('titulo', '') }}"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción *</label>
            <textarea name="descripcion" rows="4" placeholder="Ej: Atiendo urgencias eléctricas, instalaciones, tableros y mantenimiento..."
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">{{ form.get('descripcion', '') }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Categoría *</label>
            <select name="categoria_id" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">
                <option value="">-- Elegir categoría --</option>
                {% for c in categorias %}
                <option value="{{ c.id }}" {% if selected_categoria == c.id|string or form.get('categoria_id') == c.id|string %}selected{% endif %}>
                    {{ c.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Precio (S/.) *</label>
                <input type="number" name="precio" min="0" step="0.01" required placeholder="Ej: 80.00"
                    value="{{ form.get('precio', '') }}"
                    class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación *</label>
                <input type="text" name="ubicacion" required placeholder="Huancayo, El Tambo..."
                    value="{{ form.get('ubicacion', '') }}"
                    class="w-full px-4 py-2 border rounded-lg">
            </div>
        </div>
        <button type="submit"
            class="w-full py-3 gradient-bg text-white rounded-lg font-medium hover:opacity-90 transition">
            Publicar servicio
        </button>
    </form>
</div>
{% endblock %}
