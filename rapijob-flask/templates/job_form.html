{% extends "base.html" %}
{% block title %}Solicitar un Técnico - RapiJob{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-2">Solicitar un técnico</h1>
    <p class="text-gray-500 mb-6">Cuéntanos qué necesitas y los técnicos te enviarán sus cotizaciones.</p>

    <form method="POST" class="bg-white rounded-xl shadow p-8 space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">¿Qué necesitas reparar? *</label>
            <input type="text" name="title" required placeholder="Ej: Caño roto goteando en la cocina"
                value="{{ form.get('title', '') }}"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Describe el problema *</label>
            <textarea name="description" rows="4" placeholder="Ej: Desde el lunes gotea debajo del lavadero y se moja todo el piso..."
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">{{ form.get('description', '') }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Categoría del servicio *</label>
            <select name="specialty_id" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">
                <option value="">-- Elegir categoría --</option>
                {% for s in specialties %}
                <option value="{{ s.id }}" {% if selected_specialty == s.id|string or form.get('specialty_id') == s.id|string %}selected{% endif %}>
                    {{ s.name }}{% if s.description %} — {{ s.description }}{% endif %}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Distrito *</label>
                <select name="district" required class="w-full px-4 py-2 border rounded-lg">
                    <option value="">-- Elegir distrito --</option>
                    {% for d in ['Huancayo', 'El Tambo', 'Chilca'] %}
                    <option value="{{ d }}" {% if form.get('district') == d %}selected{% endif %}>{{ d }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Urgencia</label>
                <select name="urgency" class="w-full px-4 py-2 border rounded-lg">
                    <option value="low" {% if form.get('urgency') == 'low' %}selected{% endif %}>Puede esperar</option>
                    <option value="normal" {% if not form.get('urgency') or form.get('urgency') == 'normal' %}selected{% endif %}>Próximos días</option>
                    <option value="high" {% if form.get('urgency') == 'high' %}selected{% endif %}>Hoy mismo</option>
                    <option value="urgent" {% if form.get('urgency') == 'urgent' %}selected{% endif %}>Urgente</option>
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Dirección y referencia</label>
            <input type="text" name="address" placeholder="Ej: Jr. Huancavelica 234, a la altura del parque"
                value="{{ form.get('address', '') }}"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">
        </div>
        <button type="submit"
            class="w-full py-3 gradient-bg text-white rounded-lg font-medium hover:opacity-90 transition">
            Publicar solicitud
        </button>
    </form>
</div>
{% endblock %}
