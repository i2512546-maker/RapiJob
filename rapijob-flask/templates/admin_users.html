{% extends "base.html" %}
{% block title %}Administrar Usuarios - RapiJob{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Administrar Usuarios</h1>

<div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-4 py-3 text-left">Nombre</th>
                <th class="px-4 py-3 text-left">Email</th>
                <th class="px-4 py-3 text-left">Ciudad</th>
                <th class="px-4 py-3 text-center">Rol</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr class="border-t hover:bg-gray-50">
                <td class="px-4 py-3 font-medium">{{ user.nombre }}</td>
                <td class="px-4 py-3 text-gray-500">{{ user.email }}</td>
                <td class="px-4 py-3 text-gray-500">{{ user.ciudad or '-' }}</td>
                <td class="px-4 py-3 text-center">
                    <span class="px-2 py-1 rounded text-xs
                        {% if user.rol == 'proveedor' %}bg-blue-100 text-blue-800
                        {% else %}bg-green-100 text-green-800{% endif %}">
                        {{ user.rol }}
                    </span>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
