services:
  - type: web
    name: rapijob-api
    env: docker
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
