services:
  mysql:
    image: mysql:8.0
    container_name: rapijob-mysql
    environment:
      MYSQL_ROOT_PASSWORD: \${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: plataforma_servicios_tecnicos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\$\$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rapijob-backend
    environment:
      DATABASE_URL: mysql+mysqlconnector://root:\${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/plataforma_servicios_tecnicos
      SECRET_KEY: \${SECRET_KEY:-change-this-secret-before-deploy}
      DEBUG: "False"
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
